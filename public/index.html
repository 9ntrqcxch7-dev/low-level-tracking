<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛩️ Low-Level Aircraft Tracking System</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🛩️ Low-Level Aircraft Tracking System</h1>
            <p class="subtitle">Real-time Aircraft Low-Level Navigation Tracking</p>
        </header>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="controls-left">
                <button id="playBtn" class="btn btn-primary">▶️ Play</button>
                <button id="pauseBtn" class="btn btn-secondary" disabled>⏸️ Pause</button>
                <button id="resetBtn" class="btn btn-secondary">🔄 Reset</button>
            </div>
            
            <div class="controls-center">
                <label for="speedControl">Speed:</label>
                <input type="range" id="speedControl" min="1" max="300" value="1" step="1">
                <span id="speedValue">1x</span>
            </div>
            
            <div class="controls-right">
                <div class="status">
                    <span id="connectionStatus" class="status-disconnected">⚫ Disconnected</span>
                    <span id="timeDisplay">Time: 0s</span>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Aircraft Info Panel -->
        <div class="info-panel">
            <!-- Mission Editor -->
            <div id="mission-editor">
                <h3>✏️ Mission Editor</h3>
                <button id="toggle-editor-btn" class="btn btn-secondary">Show Editor</button>
                
                <div id="editor-panel" style="display: none;">
                    <form id="aircraft-form">
                        <div class="form-group">
                            <label>Callsign</label>
                            <input type="text" id="input-callsign" placeholder="e.g., VIPER-3" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Speed (knots)</label>
                            <input type="number" id="input-speed" value="250" min="100" max="500" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Start Time (UTC)</label>
                            <input type="time" id="input-start-time" value="07:00" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Color</label>
                            <input type="color" id="input-color" value="#0000ff">
                        </div>
                        
                        <div class="form-group">
                            <label>Waypoints: <span id="waypoint-count">0</span></label>
                            <button type="button" id="add-waypoint-btn" class="btn btn-small btn-info">📍 Click Map to Add</button>
                            <button type="button" id="clear-waypoints-btn" class="btn btn-small btn-warning">Clear All</button>
                        </div>
                        
                        <div id="waypoint-list"></div>
                        
                        <button type="submit" class="btn btn-primary">Add Aircraft</button>
                    </form>
                    
                    <div id="editor-actions">
                        <button id="save-mission-btn" class="btn btn-success">💾 Save Mission</button>
                        <button id="load-mission-btn" class="btn btn-info">📂 Load Mission</button>
                        <input type="file" id="mission-file-input" accept=".json" style="display: none;">
                        <button id="clear-all-btn" class="btn btn-danger">🗑️ Clear All Aircraft</button>
                    </div>
                </div>
            </div>
            
            <h3>Active Aircraft</h3>
            <div id="aircraftList"></div>
        </div>
    </div>

    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
